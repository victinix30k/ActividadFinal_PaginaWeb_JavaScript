<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alistamiento Helldivers</title>
    <link rel="stylesheet" href="../Css/Alistate.css">
</head>
<body>
    <div class="container">
        <h1> Alistamiento Helldivers </h1>
        
        <form>
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="18" required>
            </div>
            
            <div class="form-group">
                <label for="experiencia">¿Experiencia en combate?</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="experiencia" value="principiante" required> Principiante
                    </label>
                    <label>
                        <input type="radio" name="experiencia" value="intermedio"> Intermedio
                    </label>
                    <label>
                        <input type="radio" name="experiencia" value="experto"> Experto
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="classe">Clase Preferida:</label>
                <select id="classe" name="classe" required>
                    <option value="">Selecciona una clase</option>
                    <option value="assault">Asalto</option>
                    <option value="support">Soporte</option>
                    <option value="recon">Reconocimiento</option>
                    <option value="tech">Técnico</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="motivacion">¿Por qué quieres alistarte?</label>
                <textarea id="motivacion" name="motivacion" required></textarea>
            </div>
            
            <button type="submit">ALISTARSE AHORA</button>
        </form>
    </div>
    <script src="../JavaScript/Alistate.js"></script>
</body>
</html>
